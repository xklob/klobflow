name: Android and companion checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-checks
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
            motion-phone/build/reports/
            motion-phone/build/outputs/apk/debug/*.apk
  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      # Interaction and geometry checks do not download model weights or use
      # private footage. CPU torch pins timm's dependency to the tested runtime.
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r motion/requirements.txt
      - run: python -m pytest motion/tests -q
      - run: npm ci --prefix companion
      - run: ln -s ../companion/node_modules motion/node_modules
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: companion/node_modules/.bin/playwright install --with-deps chromium
      - run: companion/node_modules/.bin/playwright test -c motion/playwright.config.mjs
        env:
          KLOBFLOW_MOTION_PYTHON: python
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: motion-ui-checks
          path: review/rewrite/playwright-results/
